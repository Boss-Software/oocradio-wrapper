name: Publish Package to npm

on:
  release:
    types: [published] # Triggers when a GitHub Release is published
  # Alternative trigger: on push of semver tags (e.g., v1.0.0)
  # push:
  #   tags:
  #     - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # Critical permissions required for Trusted Publishing & Provenance
    permissions:
      id-token: write    # Allows npm to verify the OpenID Connect (OIDC) token
      contents: read     # Allows checking out the repository code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      # Optional build step if your project requires bundling/compilation
      # - name: Build Project
      #   run: npm run build

      - name: Publish to npm
        # --provenance links the build publicly back to this specific GitHub Action run
        run: npm publish --provenance --access public
